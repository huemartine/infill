# Zoning capacity rules (Section 9.2). District -> how many dwelling units the
# lot area supports. Codes and densities from the Cincinnati zoning code (CMC
# Title XIV) as published in the CAGIS Countywide Zoning layer's own
# descriptions (e.g. "SF-6: Single-family (6,000 sf lots)", "RM-2.0: 2,000
# sf/unit"). Non-Cincinnati jurisdictions (townships, RZC) are not yet encoded:
# unknown district => no capacity signal (conservative zero, never a guess).
#
# allowed_units = floor(lot_sqft / sqft_per_unit), capped at max_units_cap.
# For SF districts sqft_per_unit is the minimum lot size — a 12,000 sqft lot in
# SF-4 supports 3 units via subdivision, which is precisely the infill play.
# residential: false => zero residential capacity (parks, manufacturing, PD
# unknowable without the plan documents).

version: "2026.6"
max_units_cap: 100          # sanity cap per parcel
gap_saturation_units: 12    # capacity_gap_score ~= 100*(1-exp(-gap/this))

districts:
  # --- single-family (min lot size per unit) ---
  SF-20:   { sqft_per_unit: 20000 }
  SF-10:   { sqft_per_unit: 10000 }
  SF-6:    { sqft_per_unit: 6000 }
  SF-4:    { sqft_per_unit: 4000 }
  SF-2:    { sqft_per_unit: 2000 }
  # --- small multifamily / mixed residential ---
  RMX:     { sqft_per_unit: 2000, max_units: 3 }   # 1-3 family by right
  RM-2.0:  { sqft_per_unit: 2000 }
  RM-1.2:  { sqft_per_unit: 1200 }
  RM-0.7:  { sqft_per_unit: 700 }
  # --- neighborhood / community commercial (mixed-use residential above) ---
  CN-P:    { sqft_per_unit: 1200 }
  CN-M:    { sqft_per_unit: 1200 }
  CC-P:    { sqft_per_unit: 1000 }
  CC-M:    { sqft_per_unit: 1000 }
  # auto-oriented commercial: strip/big-box corridors. Housing is not built
  # here in practice (and often not permitted by right) - no residential capacity.
  CC-A:    { residential: false }
  CG-A:    { residential: false }
  UM:      { sqft_per_unit: 800 }
  OL:      { sqft_per_unit: 1500 }
  OG:      { sqft_per_unit: 1200 }
  IR:      { sqft_per_unit: 1200 }
  # --- form-based transect districts (OTR etc.) ---
  T3N:      { sqft_per_unit: 2500 }
  T4N.SF:   { sqft_per_unit: 1500 }
  T4N.SF-O: { sqft_per_unit: 1500 }
  T4N.MF:   { sqft_per_unit: 1000 }
  T4N.MF-O: { sqft_per_unit: 1000 }
  T5N.SS:   { sqft_per_unit: 700 }
  T5N.SS-O: { sqft_per_unit: 700 }
  T5N.LS:   { sqft_per_unit: 700 }
  T5N.LS-O: { sqft_per_unit: 700 }
  T5MS:     { sqft_per_unit: 600 }
  T5MS-O:   { sqft_per_unit: 600 }
  T5F:      { sqft_per_unit: 600 }
  DD:       { sqft_per_unit: 400 }
  # --- riverfront ---
  RF-R:    { sqft_per_unit: 1200 }
  RF-C:    { sqft_per_unit: 1200 }
  RF-M:    { residential: false }
  # --- no residential capacity ---
  PR:      { residential: false }
  PD:      { residential: false }   # planned development: unknowable without the plan
  ML:      { residential: false }
  MG:      { residential: false }
  ME:      { residential: false }
  MA:      { residential: false }

# Connected Communities (2024 reform) relaxations — dormant until the CC
# boundary layer is reconstructed (no published feature service found).
# Applied when parcel_master.cc_zone is set.
cc_overrides:
  nbd:      { min_units: 4 }        # middle housing by right near NBDs
  corridor: { min_units: 4 }
  brt:      { min_units: 4, sqft_per_unit_factor: 0.75 }
