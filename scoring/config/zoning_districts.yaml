# Buildable-envelope rules per zoning district, transcribed from each
# jurisdiction's OFFICIAL published code. Every district carries the section it
# came from so a number can be traced back and re-checked.
#
# This drives the plain-English zoning read shown on a parcel. It deliberately
# stops at the RULES and does not compute a lot yield: how many units a site
# actually supports depends on topography, access, utilities and what the
# municipality will approve, which is the agent's call, not the model's.
#
# IMPORTANT: this is informational, not a zoning determination. Overlays, planned
# districts, variances, deed restrictions and lot-specific history all move these
# numbers, and the municipality is the only authority. Anything not verified
# against the official text is left absent rather than guessed.
#
# units: feet for setbacks/width/height, square feet for areas.
# side_yard_ft is the MINIMUM on one side; side_yard_total_ft is the required sum
# of both sides where the code states a min/total pair (e.g. Cincinnati "7/16").
#
# `overlays:` holds suffix designations the county appends to the base code
# (SF-6-MH, RM-1.2-T, A_HOD). They modify the base district rather than replace
# it, so they are matched separately and reported alongside it.

version: "2026.2"

jurisdictions:

  blue_ash:
    name: City of Blue Ash
    source: Codified Ordinances of Blue Ash, Part Eleven - Planning and Zoning Code
    citation: "Blue Ash Ord. 1131.01, Table 1131-1 (Ord. 2017 passed 1-26-17; Ord. 2020-1 passed 2-27-20)"
    url: https://codelibrary.amlegal.com/codes/blueash/latest/blueash_oh/0-0-0-26142
    verified: "2026-08-11"
    # The front-yard footnote is a real-world gotcha worth surfacing: in EXISTING
    # residential areas the required front setback is the AVERAGE of the existing
    # front setbacks of principal structures on the same side of the street within
    # 300 ft, when that average is LESS than the district minimum (panhandle lots
    # excepted). So the table value is a ceiling on established streets.
    front_yard_note: >-
      In existing residential areas the required front setback is the average of
      existing front setbacks on the same side of the street within 300 ft when
      that average is less than the district minimum (does not apply to panhandle
      lots) - Blue Ash 1131.01 note **.
    districts:
      R-1:
        name: Residential Low Density
        residential: true
        min_lot_area_sqft: 20000
        min_lot_width_ft: 110
        front_yard_ft: 50
        side_yard_ft: 15
        rear_yard_ft: 30
        max_height_ft: 35
        uses: Single-family detached
      R-2:
        name: Residential Medium Density
        residential: true
        min_lot_area_sqft: 15000
        min_lot_width_ft: 90
        front_yard_ft: 50
        side_yard_ft: 10
        rear_yard_ft: 30
        max_height_ft: 35
        uses: Single-family detached
      R-3:
        name: Residential High Density
        residential: true
        min_lot_area_sqft: 6250       # per DWELLING UNIT, not per lot
        area_is_per_unit: true
        min_lot_width_ft: 50          # single-family detached lots only; no
        width_applies_to: single_family_only   # minimum for non-single-family
        front_yard_ft: 40
        side_yard_ft: 5
        rear_yard_ft: 25
        max_height_ft: 35
        uses: Single-family through multi-family
      BAN:
        name: Blue Ash North District
        residential: false
        front_yard_ft: 30
        max_height_ft: 90
        uses: Commercial
      SPD:
        name: Summit Park District
        residential: false
        front_yard_ft: 30
        max_height_ft: 90
        uses: Commercial / mixed use
        note: Appears as "SP" in the code table and "SPD" in the county zoning layer.
      BAS:
        name: Blue Ash South District
        residential: false
        front_yard_ft: 30
        max_height_ft: 50
        uses: Commercial
      DT:
        name: Downtown District
        residential: true
        uses: Downtown mixed use
        # Yard, lot and height regulations for Downtown live in 1135.07, not the
        # summary table - not transcribed yet, so no envelope is asserted here.
        note: Downtown yard/lot/height regulations are in Blue Ash 1135.07 (not yet transcribed).

