[project]
name = "infill-platform"
version = "0.1.0"
description = "Parcel-level development opportunity scoring for Hamilton County, OH."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "boto3>=1.34",
    "prefect>=2.19",
    "dbt-postgres>=1.8",
    "reportlab>=4.2",        # print-ready outreach-letter PDFs
    "qrcode[pil]>=8.0",      # QR code -> digital response page on the letter
    "python-docx>=1.1",      # editable Word version of the outreach letter
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "respx>=0.21"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "scoring/tests", "orchestration/tests", "api/tests"]
